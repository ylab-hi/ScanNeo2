name: Tests
run-name: ${{ github.actor }} is testing ScanNeo2

on: [push]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # pandas and blosum at the prioritization env's versions, so tests run
      # filtering.py's real code with the libraries the workflow uses
      - name: Install pytest + report.py / filtering.py runtime deps
        run: pip install pytest pyyaml pandas==2.2.3 blosum==2.0.2
      - name: Run unit tests
        run: pytest .tests/unit/ -v
