channels:
 - bioconda
 - conda-forge
 - nodefaults
dependencies:
 - python=3.11
 - vcfpy=0.14.2
 - pyfaidx=0.7.0
 # pyfaidx 0.7.0 imports pkg_resources, which setuptools is removing; newer
 # pyfaidx builds do not solve alongside blast 2.15 / perl 5.26 here
 - setuptools=80.10.2
 - configargparse=1.7
 - pandas=2.2.3
 - blast=2.15.0
 - zstd=1.5.5
 - pip=24.0
 - perl=5.26.2
 - perl-env=1.04
 - pip:
   - gffutils==0.12
   - blosum==2.0.2
